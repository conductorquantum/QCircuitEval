name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          cache-suffix: quality
      - run: uv sync --extra dev --extra docs
      - run: uv run python ci/generate_semantic_assets.py --check
      - run: uv run python ci/generate_qec_semantic_assets.py --check
      - run: uv run python ci/check_asset_consistency.py
      - run: uv run python ci/check_packaged_assets_wheel.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ruff check --select C901 .
      - run: uv run mypy
      - run: uv run sphinx-build -W -b html docs docs/_build/html
      - uses: actions/upload-artifact@v7
        with:
          name: qceval-docs-html
          path: docs/_build/html
          if-no-files-found: error
